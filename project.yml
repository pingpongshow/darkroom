name: DarkRoom
options:
  bundleIdPrefix: com.pingpongshow
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  DarkRoomKit:
    path: Packages/DarkRoomKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DarkRoom:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
      - path: Vendor/exiftool
        type: folder
        buildPhase: resources
      - path: docs/UserGuide.md
        buildPhase: resources
    dependencies:
      - package: DarkRoomKit
        product: ImmichAPI
      - package: DarkRoomKit
        product: DarkRoomCore
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DarkRoom
        CFBundleName: DarkRoom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "DarkRoom — a Mac client for Immich"
        NSLocalNetworkUsageDescription: DarkRoom connects to your Immich server on your local network.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.pingpongshow.darkroom.preset
            UTTypeDescription: DarkRoom Preset
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [darkroom-preset]
        CFBundleDocumentTypes:
          - CFBundleTypeName: DarkRoom Preset
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.pingpongshow.darkroom.preset]
          - CFBundleTypeName: Lightroom Preset or LUT
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions: [xmp, cube, lrtemplate]
        NSServices:
          - NSMenuItem: { default: Upload to Immich with DarkRoom }
            NSMessage: uploadFiles
            NSPortName: DarkRoom
            NSRequiredContext: { NSTextContent: FilePath }
            NSSendFileTypes: [public.image, public.movie, public.folder]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPrincipalClass: NSApplication
        SUFeedURL: https://github.com/pingpongshow/darkroom/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    entitlements:
      path: App/DarkRoom.entitlements
      properties:
        com.apple.security.cs.allow-jit: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pingpongshow.darkroom
        PRODUCT_NAME: DarkRoom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        # Sparkle EdDSA public key (docs/Releasing.md). Empty disables update checks.
        SPARKLE_PUBLIC_KEY: "uqE1BWQAq70lEDTD/3leo2DS23EwLtKXhjBjj3pDdOA="

  DarkRoomUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: App/UITests
    dependencies:
      - target: DarkRoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pingpongshow.darkroom.uitests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DarkRoom

schemes:
  DarkRoom:
    build:
      targets:
        DarkRoom: all
        DarkRoomUITests: [test]
    test:
      targets:
        - DarkRoomUITests

name: DarkRoom
options:
  bundleIdPrefix: com.pingpongshow
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  DarkRoomKit:
    path: Packages/DarkRoomKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DarkRoom:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: DarkRoomKit
        product: ImmichAPI
      - package: DarkRoomKit
        product: DarkRoomCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DarkRoom
        CFBundleName: DarkRoom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "DarkRoom — a Mac client for Immich"
        NSLocalNetworkUsageDescription: DarkRoom connects to your Immich server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: App/DarkRoom.entitlements
      properties:
        com.apple.security.cs.allow-jit: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pingpongshow.darkroom
        PRODUCT_NAME: DarkRoom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO

  DarkRoomUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: App/UITests
    dependencies:
      - target: DarkRoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pingpongshow.darkroom.uitests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DarkRoom

schemes:
  DarkRoom:
    build:
      targets:
        DarkRoom: all
        DarkRoomUITests: [test]
    test:
      targets:
        - DarkRoomUITests

# DarkRoom test server: stock Immich, isolated from any real library.
# Deployed on the test host under /mnt/docker/darkroom-test. The API is bound to the host's
# loopback only (127.0.0.1:2284) and reached from the Mac through an SSH tunnel:
#   scripts/test-server.sh tunnel   ->  http://localhost:2283
name: darkroom-test
services:
  immich-server:
    container_name: darkroom-test-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    volumes:
      - ./library:/data
      - /etc/localtime:/etc/localtime:ro
    env_file: [.env]
    ports:
      - '127.0.0.1:2284:2283'
    depends_on: [redis, database]
    restart: unless-stopped
  immich-machine-learning:
    container_name: darkroom-test-ml
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    volumes:
      - ./model-cache:/cache
    env_file: [.env]
    restart: unless-stopped
  redis:
    container_name: darkroom-test-redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped
  database:
    container_name: darkroom-test-db
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ./postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
